# BiocJobs job specification.
# This file, together with scripts/variantannotation-extract-numeric-genotypes.R,
# is all a package maintainer adds to make this analysis dispatchable.
biocjobs: "1.0"
name: variantannotation-extract-numeric-genotypes
package: VariantAnnotation
title: Extract numeric genotypes from a VCF
tagline: filter by regions and samples and generate numeric genotypes
description: >
  Imports a BED file indicating regions to output, as well as a plain text file
  listing samples to include. Then uses VariantAnnotation to import the GT
  matrix from the indexed VCF. Only variants that pass filtering are retained.
  Outputs a tab-delimited text containing chromsome, position, reference and
  alternative alleles, and genotypes expressed as alternative allele count.
version: "1.0.0"
license: MIT
script: variantannotation-extract-numeric-genotypes.R
depends: []   # runtime deps beyond the host package (shrinkage)

inputs:
  - name: vcf
    format: vcf
    label: VCF (variant call format) file
    help: >
      VCF in standard format, listing variant information and genotypes.
  - name: index
    format: tbi
    label: TBI tabix index for VCF
    help: >
      Index such as that generated by 'bcftools index --tbi'. Necessary for
      extraction of specific regions from the VCF.
  - name: bed
    format: bed
    label: BED file of regions to include
    help: >
      